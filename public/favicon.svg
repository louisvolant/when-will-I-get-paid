<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Glow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#emerald-grad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Calendar Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="88" y="112" width="336" height="304" rx="44" fill="url(#card-grad)" stroke="#334155" stroke-width="6" />

    <!-- Calendar Header -->
    <path d="M 88 156 A 44 44 0 0 1 132 112 L 380 112 A 44 44 0 0 1 424 156 L 424 196 L 88 196 Z" fill="url(#emerald-grad)" />

    <!-- Calendar Rings -->
    <rect x="156" y="84" width="28" height="60" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="5" />
    <rect x="328" y="84" width="28" height="60" rx="14" fill="#f8fafc" stroke="#0f172a" stroke-width="5" />

    <!-- Calendar Header Highlights -->
    <circle cx="212" cy="154" r="7" fill="#ffffff" opacity="0.8" />
    <circle cx="256" cy="154" r="7" fill="#ffffff" opacity="0.8" />
    <circle cx="300" cy="154" r="7" fill="#ffffff" opacity="0.8" />

    <!-- Big Payday Coin / Badge -->
    <circle cx="256" cy="296" r="82" fill="url(#gold-grad)" stroke="#fef3c7" stroke-width="8" />
    
    <!-- Coin Inner Ring -->
    <circle cx="256" cy="296" r="68" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Currency / Pay Symbol -->
    <text x="256" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="94" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">€</text>
  </g>

  <!-- Sparkles -->
  <path d="M 390 120 Q 390 144 414 144 Q 390 144 390 168 Q 390 144 366 144 Q 390 144 390 120 Z" fill="#fbbf24" />
  <path d="M 124 374 Q 124 390 140 390 Q 124 390 124 406 Q 124 390 108 390 Q 124 390 124 374 Z" fill="#34d399" />
  <circle cx="400" cy="340" r="10" fill="#34d399" opacity="0.75" />
  <circle cx="106" cy="240" r="8" fill="#fbbf24" opacity="0.75" />
</svg>